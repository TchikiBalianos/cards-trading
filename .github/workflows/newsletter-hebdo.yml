# Compose le digest hebdomadaire et crée un BROUILLON Resend Broadcast.
#
# N'envoie jamais rien tout seul — voir scripts/newsletter-hebdo.mjs pour
# le détail. Julian relit dans le dashboard Resend et clique envoyer.
#
# Cadence : samedi, après les deux articles de la semaine (mardi
# obligatoire, vendredi optionnel) ET après le passage de cote-hebdo le
# jeudi, dont ce script lit le podium archivé.
#
# Pas de `permissions: contents: write` : ce script ne committe rien,
# contrairement à annonce-discord/buffer/cote-hebdo.

name: Newsletter hebdomadaire

on:
  schedule:
    # 11:37 UTC = 13:37 à Paris en été.
    - cron: '37 11 * * 6'
  workflow_dispatch:

jobs:
  digest:
    name: Composer et créer le brouillon
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Installer les dépendances
        run: npm ci --omit=dev --ignore-scripts=false

      - name: Créer le brouillon
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/newsletter-hebdo.mjs
