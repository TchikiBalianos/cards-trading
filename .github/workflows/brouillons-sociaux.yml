# Prépare dans Buffer les posts éditoriaux de la semaine, en BROUILLONS DATÉS.
#
# Déclenché par le dépôt d'un fichier `data/social/<lundi>.json` sur main
# (écrit chaque samedi par la routine de rédaction, ou à la main). Julian relit
# ensuite les brouillons dans Buffer et clique « Schedule Post » : un brouillon
# ne part jamais tout seul, c'est `controle-social.yml` qui prévient quand l'un
# d'eux approche sans avoir été programmé.
#
# ⚠️ Découpage en phases, pour la même raison que `cote-hebdo.yml` : Buffer
# récupère les visuels par URL publique, donc ils doivent être committés ET
# déployés par Vercel avant qu'on puisse les référencer.
#
# ⚠️ Le commit des visuels ne porte PAS `[skip ci]`, par prudence : on l'a cru
# honoré par Vercel (les images ne seraient jamais déployées). Constaté le
# 5 octobre 2026 : il ne l'est pas dans ce dépôt, voir CLAUDE.md. Seul le
# commit des identifiants Buffer en porte un, il ne change rien au site.
#
# Idempotent : un post dont les brouillons existent déjà n'est pas retraité, et
# un brouillon identique déjà présent dans Buffer est adopté au lieu d'être
# recréé. Relancer après un échec est sans danger.

name: Brouillons sociaux

on:
  push:
    branches: [main]
    paths:
      - 'data/social/*.json'
  workflow_dispatch:
    inputs:
      fichier:
        description: "Fichier à traiter (ex. data/social/2026-10-05.json), sinon tous"
        type: string
        default: ''
      essai:
        description: "Essai à blanc : valider et afficher, sans rien créer dans Buffer"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: brouillons-sociaux
  cancel-in-progress: false

jobs:
  preparer:
    name: Brouillons Buffer de la semaine
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # `sharp` arrive avec Astro : sans installation, la génération des visuels
      # échouerait sur l'agent.
      - name: Installer les dépendances
        run: npm ci --omit=dev --ignore-scripts=false

      # Les cartes Build in Public écrivent en chasse fixe (DejaVu Sans Mono). Sans
      # elle, librsvg substitue une autre police et les lignes du bordereau, dont
      # la largeur est calculée à 0,6 em, peuvent déborder du ticket.
      - name: Installer la police à chasse fixe
        run: |
          fc-list | grep -qi "DejaVu Sans Mono" || (sudo apt-get update -qq && sudo apt-get install -y -qq fonts-dejavu-core)
          fc-match "DejaVu Sans Mono"

      - name: Valider les fichiers de semaine
        run: node scripts/brouillons-sociaux.mjs --valider ${{ inputs.fichier && format('--fichier={0}', inputs.fichier) || '' }}

      - name: Générer les visuels
        run: node scripts/brouillons-sociaux.mjs --phase=visuels ${{ inputs.fichier && format('--fichier={0}', inputs.fichier) || '' }}

      - name: Déployer les visuels
        if: ${{ !inputs.essai }}
        run: |
          if [ -z "$(git status --porcelain -- public/assets/social/semaine/)" ]; then
            echo "Visuels déjà committés, rien à déployer."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/assets/social/semaine/
          git commit -m "chore(social): visuels des posts de la semaine"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      - name: Attendre que les visuels soient servis
        if: ${{ !inputs.essai }}
        run: node scripts/brouillons-sociaux.mjs --phase=attendre ${{ inputs.fichier && format('--fichier={0}', inputs.fichier) || '' }}

      - name: Créer les brouillons dans Buffer
        env:
          BUFFER_API_KEY: ${{ secrets.BUFFER_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          if [ "${{ inputs.essai }}" = "true" ]; then
            node scripts/brouillons-sociaux.mjs --phase=brouillons --dry-run ${{ inputs.fichier && format('--fichier={0}', inputs.fichier) || '' }}
          else
            node scripts/brouillons-sociaux.mjs --phase=brouillons ${{ inputs.fichier && format('--fichier={0}', inputs.fichier) || '' }}
          fi

      # `always()` : si un seul réseau a échoué, les autres brouillons SONT créés.
      # Ne pas committer leurs identifiants ferait re-créer ces brouillons-là.
      - name: Mémoriser les identifiants Buffer
        if: ${{ always() && !inputs.essai }}
        run: |
          if git diff --quiet -- data/social/; then
            echo "Aucun identifiant nouveau, rien à committer."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/social/
          git commit -m "chore(social): memorise les brouillons Buffer [skip ci]"
          git pull --rebase --autostash origin main
          git push origin HEAD:main
