name: Keep-alive Supabase

# Pourquoi ce workflow alors qu'un cron Vercel existe déjà :
#
# Les crons du plan Hobby sont « best effort » — fenêtre de déclenchement d'une
# heure, aucune garantie d'exécution — et la rétention des logs y est plafonnée
# à 1 heure, ce qui rend impossible de vérifier a posteriori s'ils sont partis.
# Supabase a envoyé un avertissement de mise en pause alors que le cron Vercel
# était pourtant actif (août 2026).
#
# GitHub Actions apporte deux choses que Vercel Hobby ne donne pas :
#   - une fréquence libre (ici toutes les 6 h, contre 1×/jour maximum sur Hobby)
#   - un HISTORIQUE D'EXÉCUTION consultable dans l'onglet Actions
#
# Le cron Vercel reste en place : les deux sont redondants, c'est voulu.

on:
  schedule:
    # Toutes les 6 heures. Volontairement décalé de 17 min : les crons GitHub
    # sont retardés aux heures rondes, quand toute la planète programme ses jobs.
    - cron: '17 */6 * * *'
  workflow_dispatch:        # permet de le lancer à la main depuis l'onglet Actions

# Empêche deux exécutions simultanées si une précédente traîne
concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Réveiller la base Supabase
        run: |
          URL="https://www.cards-trading.com/api/keep-alive"

          # 3 tentatives espacées : une indisponibilité passagère de Vercel ne
          # doit pas faire échouer le job, seul un échec persistant compte.
          for tentative in 1 2 3; do
            echo "--- Tentative $tentative ---"
            reponse=$(curl -sS -m 45 -w '\n%{http_code}' "$URL?src=gha&t=$(date +%s)" || true)
            corps=$(echo "$reponse" | sed '$d')
            code=$(echo "$reponse" | tail -n1)

            echo "HTTP  : $code"
            echo "Corps : $corps"

            if [ "$code" = "200" ] && echo "$corps" | grep -q '"ok":true'; then
              echo "✅ Base réveillée."
              exit 0
            fi

            [ $tentative -lt 3 ] && sleep 30
          done

          echo "::error::Le keep-alive a échoué 3 fois. La base est peut-être en pause."
          echo "Vérifier : https://supabase.com/dashboard/project/frbwmzgaqmylilzciptg"
          exit 1
