name: Keep-alive Supabase

# Deux bases Supabase à maintenir éveillées, et elles sont distinctes :
#
#   frbwmzgaqmylilzciptg  « Cards-Trading »      → landing page (beta_submissions)
#   uxewpdnkjsdfizaoerpo  « cards-trading-app »  → marketplace (listings, escrow…)
#
# Le plan gratuit met un projet en pause après ~7 jours sans activité API.
# Vérifié le 18/08/2026 : une requête NON authentifiée (401) n'apparaît même
# pas dans edge_logs — elle ne compte donc PAS comme activité. Il faut une
# requête authentifiée qui exécute réellement du SQL.
#
# Les crons Vercel du plan Hobby sont « best effort » (fenêtre d'1 h, aucune
# garantie) et leurs logs ne sont retenus qu'1 h, ce qui empêche de vérifier
# a posteriori s'ils sont partis. GitHub Actions donne la fréquence ET la
# traçabilité. Le repo étant public, les minutes sont illimitées.

on:
  schedule:
    # Toutes les 6 h. Décalé de 17 min : les crons GitHub sont retardés aux
    # heures rondes, quand toute la planète programme ses jobs.
    - cron: '17 */6 * * *'
  workflow_dispatch:

concurrency:
  group: keep-alive
  cancel-in-progress: false

jobs:
  landing:
    name: Base landing (via /api/keep-alive)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Réveiller la base de la landing
        run: |
          URL="https://www.cards-trading.com/api/keep-alive"
          for tentative in 1 2 3; do
            echo "--- Tentative $tentative ---"
            reponse=$(curl -sS -m 45 -w '\n%{http_code}' "$URL?src=gha&t=$(date +%s)" || true)
            corps=$(echo "$reponse" | sed '$d')
            code=$(echo "$reponse" | tail -n1)
            echo "HTTP  : $code"
            echo "Corps : $corps"
            if [ "$code" = "200" ] && echo "$corps" | grep -q '"ok":true'; then
              echo "✅ Base landing réveillée."
              exit 0
            fi
            [ $tentative -lt 3 ] && sleep 30
          done
          echo "::error::keep-alive landing en échec après 3 tentatives."
          echo "Vérifier : https://supabase.com/dashboard/project/frbwmzgaqmylilzciptg"
          exit 1

  marketplace:
    name: Base marketplace (RPC ping directe)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Réveiller la base de la marketplace
        env:
          # Clé publishable (anon) du projet uxewpdnkjsdfizaoerpo.
          # En secret et non en clair : le repo est PUBLIC. Cette clé est
          # conçue pour être publique et protégée par RLS, mais l'exposer
          # inviterait au sondage et à la consommation de quota.
          CLE: ${{ secrets.SUPABASE_APP_ANON_KEY }}
        run: |
          if [ -z "$CLE" ]; then
            echo "::error::Secret SUPABASE_APP_ANON_KEY absent."
            echo "À créer dans Settings → Secrets and variables → Actions."
            echo "Valeur : la clé publishable (anon) du projet cards-trading-app."
            exit 1
          fi

          URL="https://uxewpdnkjsdfizaoerpo.supabase.co/rest/v1/rpc/ping"
          for tentative in 1 2 3; do
            echo "--- Tentative $tentative ---"
            reponse=$(curl -sS -m 45 -X POST "$URL" \
              -H "apikey: $CLE" \
              -H "Authorization: Bearer $CLE" \
              -H "Content-Type: application/json" \
              -d '{}' -w '\n%{http_code}' || true)
            corps=$(echo "$reponse" | sed '$d')
            code=$(echo "$reponse" | tail -n1)
            echo "HTTP  : $code"
            echo "Corps : $corps"
            if [ "$code" = "200" ] && echo "$corps" | grep -q '"ok":true'; then
              echo "✅ Base marketplace réveillée."
              exit 0
            fi
            [ $tentative -lt 3 ] && sleep 30
          done
          echo "::error::keep-alive marketplace en échec après 3 tentatives."
          echo "Vérifier : https://supabase.com/dashboard/project/uxewpdnkjsdfizaoerpo"
          exit 1
